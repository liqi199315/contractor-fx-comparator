name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: contractor-fx-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, Build, and SEO Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_SITE_URL: https://contractorfx.com
      PUBLIC_GA4_MEASUREMENT_ID: G-BMWC0P9PW2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and CLI tests
        run: npm test

      - name: Build static site and CLI
        run: npm run build

      - name: Run SEO and artifact preflight
        run: npm run seo:check
